<text x="340" y="36.5" font-size="10" fill="#1B2430" text-anchor="middle" font-weight="600">callback #2</text>
<text x="340" y="47.5" font-size="10" fill="#1B2430" text-anchor="middle" font-weight="600">(dup/concurrent)</text>
