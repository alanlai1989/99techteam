<text x="880" y="36.5" font-size="10" fill="#1B2430" text-anchor="middle" font-weight="600">Postgres</text>
<text x="360.0" y="74.0" font-size="10" fill="#1B2430" text-anchor="middle">POST /callback (txn_ref=X)</text>
<line x1="120" y1="80" x2="596.5" y2="80" stroke="#1B2430" stroke-width="1.4" marker-end="url(#arrowSolid)"/>
