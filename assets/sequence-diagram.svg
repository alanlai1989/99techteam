<line x1="600" y1="116" x2="876.5" y2="116" stroke="#1B2430" stroke-width="1.4" marker-end="url(#arrowSolid)"/>
<text x="740.0" y="146.0" font-size="10" fill="#1B2430" text-anchor="middle">INSERT funding_transactions ON CONFLICT DO NOTHING</text>
<line x1="600" y1="152" x2="876.5" y2="152" stroke="#1B2430" stroke-width="1.4" marker-end="url(#arrowSolid)"/>
<rect x="765.0" y="174.0" width="230" height="40" rx="3" fill="#EDEFEF" stroke="#D8DCDD" stroke-width="1"/>
<text x="880" y="189.0" font-size="9.5" fill="#5B6670" font-style="italic" font-weight="400" text-anchor="middle">TX1 holds the unique-index</text>
<text x="880" y="202.0" font-size="9.5" fill="#5B6670" font-style="italic" font-weight="400" text-anchor="middle">lock on (provider, txn_ref)</text>
<text x="470.0" y="234.0" font-size="10" fill="#1B2430" text-anchor="middle">POST /callback (txn_ref=X)</text>
<line x1="340" y1="240" x2="596.5" y2="240" stroke="#1B2430" stroke-width="1.4" marker-end="url(#arrowSolid)"/>
<text x="740.0" y="270.0" font-size="10" fill="#1B2430" text-anchor="middle">BEGIN TX2</text>
<line x1="600" y1="276" x2="876.5" y2="276" stroke="#1B2430" stroke-width="1.4" marker-end="url(#arrowSolid)"/>
<text x="740.0" y="306.0" font-size="10" fill="#1B2430" text-anchor="middle">INSERT funding_transactions ON CONFLICT DO NOTHING</text>
<line x1="600" y1="312" x2="876.5" y2="312" stroke="#1B2430" stroke-width="1.4" marker-end="url(#arrowSolid)"/>
<rect x="765.0" y="334.0" width="230" height="40" rx="3" fill="#FBF1E2" stroke="#B8793A" stroke-width="1"/>
<text x="880" y="349.0" font-size="9.5" fill="#8A5A22" font-style="italic" font-weight="600" text-anchor="middle">TX2 BLOCKS on TX1's lock —</text>
<text x="880" y="362.0" font-size="9.5" fill="#8A5A22" font-style="italic" font-weight="600" text-anchor="middle">stopped here</text>
<text x="740.0" y="383.5" font-size="10" fill="#1B2430" text-anchor="middle">TX1: UPDATE wallet, INSERT ledger_entry,</text>
<text x="740.0" y="394.0" font-size="10" fill="#1B2430" text-anchor="middle">status=credited</text>
<line x1="600" y1="400" x2="876.5" y2="400" stroke="#1B2430" stroke-width="1.4" marker-end="url(#arrowSolid)"/>
<text x="740.0" y="430.0" font-size="10" fill="#1B2430" text-anchor="middle">TX1: COMMIT</text>
<line x1="600" y1="436" x2="876.5" y2="436" stroke="#1B2430" stroke-width="1.4" marker-end="url(#arrowSolid)"/>
<text x="740.0" y="466.0" font-size="10" fill="#1B2430" text-anchor="middle">committed, row visible</text>
<line x1="880" y1="472" x2="603.5" y2="472" stroke="#5B6670" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrowOpen)"/>
<text x="360.0" y="502.0" font-size="10" fill="#1B2430" text-anchor="middle">200 OK</text>
<line x1="600" y1="508" x2="123.5" y2="508" stroke="#5B6670" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrowOpen)"/>
<rect x="765.0" y="530.0" width="230" height="40" rx="3" fill="#EDEFEF" stroke="#D8DCDD" stroke-width="1"/>
<text x="880" y="545.0" font-size="9.5" fill="#5B6670" font-style="italic" font-weight="400" text-anchor="middle">TX2 unblocks — its INSERT</text>
<text x="880" y="558.0" font-size="9.5" fill="#5B6670" font-style="italic" font-weight="400" text-anchor="middle">returns 0 rows</text>
<text x="740.0" y="590.0" font-size="10" fill="#1B2430" text-anchor="middle">TX2: SELECT status WHERE (provider, txn_ref)</text>
<line x1="600" y1="596" x2="876.5" y2="596" stroke="#1B2430" stroke-width="1.4" marker-end="url(#arrowSolid)"/>
<text x="740.0" y="626.0" font-size="10" fill="#1B2430" text-anchor="middle">status = credited</text>
<line x1="880" y1="632" x2="603.5" y2="632" stroke="#5B6670" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrowOpen)"/>
<text x="740.0" y="662.0" font-size="10" fill="#1B2430" text-anchor="middle">TX2: COMMIT (no writes)</text>
<line x1="600" y1="668" x2="876.5" y2="668" stroke="#1B2430" stroke-width="1.4" marker-end="url(#arrowSolid)"/>
<text x="470.0" y="698.0" font-size="10" fill="#1B2430" text-anchor="middle">200 OK — idempotent no-op</text>
<line x1="600" y1="704" x2="343.5" y2="704" stroke="#5B6670" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrowOpen)"/>
</svg>